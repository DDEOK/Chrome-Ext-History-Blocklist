<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="optionsTitle">History Blocklist settings</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        max-width: 620px;
        margin: 0 auto;
        padding: 28px 20px 60px;
      }

      header {
        margin-bottom: 6px;
      }

      header h1 {
        font-size: 20px;
      }

      .lede {
        margin: 0 0 24px;
        color: var(--text-dim);
      }

      section {
        margin-bottom: 28px;
      }

      form.add {
        margin-bottom: 10px;
      }

      .list li .domain {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .note {
        margin: 8px 0 0;
        color: var(--text-dim);
        font-size: 12px;
      }

      .note ul {
        margin: 6px 0 0;
        padding-left: 18px;
      }
    </style>
  </head>
  <body>
    <header class="row">
      <h1 data-i18n="appName">History Blocklist</h1>
      <span class="dim mono" id="version" data-i18n-title="loadedVersion"></span>
      <span class="spacer"></span>
      <label class="switch" data-i18n-title="toggleAllTitle">
        <input type="checkbox" id="enabled" />
        <span class="track"><span class="thumb"></span></span>
        <span id="enabled-label" class="dim"></span>
      </label>
    </header>
    <p class="lede" data-i18n-html="lede"></p>

    <section>
      <h2 data-i18n="secDomains">Blocked domains</h2>
      <form class="add row" id="add-form">
        <input
          type="text"
          id="domain-input"
          placeholder="example.com"
          autocomplete="off"
          spellcheck="false"
          class="mono"
        />
        <button type="submit" class="primary" data-i18n="add">Add</button>
      </form>
      <p class="status" id="status"></p>
      <ul class="list" id="list"></ul>
      <p class="note" data-i18n-html="domainsNote"></p>
    </section>

    <section>
      <h2 data-i18n="secOmnibox">Block straight from the address bar</h2>
      <p class="note" data-i18n-html="omniboxNote"></p>
      <div class="note">
        <ul>
          <li data-i18n-html="omniboxBullet1"></li>
          <li data-i18n-html="omniboxBullet2"></li>
        </ul>
      </div>
    </section>

    <section>
      <h2 data-i18n="secCleanup">Past history</h2>
      <div class="row">
        <button id="deep-sweep" data-i18n="deepSweepButton">Sweep all history again</button>
        <span class="dim" id="sweep-result"></span>
      </div>
      <p class="note" data-i18n-html="cleanupNote1"></p>
      <p class="note" data-i18n-html="cleanupNote2"></p>
    </section>

    <section>
      <h2 data-i18n="secLimits">What this cannot do</h2>
      <p class="note" data-i18n-html="limitsIntro"></p>
      <div class="note">
        <ul>
          <li data-i18n-html="limit1"></li>
          <li data-i18n-html="limit2"></li>
          <li data-i18n-html="limit3"></li>
          <li data-i18n-html="limit4"></li>
        </ul>
      </div>
    </section>

    <section>
      <h2 data-i18n="secStats">Statistics</h2>
      <p class="note mono" id="stats"></p>
    </section>

    <script type="module" src="options.js"></script>
  </body>
</html>
